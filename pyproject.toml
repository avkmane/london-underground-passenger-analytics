[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "london-underground-passenger-analytics"
version = "1.0.0"
description = "Industry-style passenger flow analytics and commuter segmentation for London Underground station data."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
